# Render blueprint — one web service, no database.
#
# The app is a single long-running process: Express serves the built React
# frontend, the API, and the SSE live stream from the same port and origin.
# There is no separate frontend deployment.
services:
  - type: web
    name: tin-city-founders
    runtime: node
    # NOTE: the free plan sleeps after ~15 min with no inbound traffic, and a
    # cold start takes ~50s. It also has NO persistent disk, so room state is
    # lost on any restart — download a backup from the host console instead of
    # relying on the disk. Warm the service before doors open, and keep an
    # external pinger (e.g. cron-job.org) hitting the URL every 10 min so the
    # first arrival does not wait on a cold start.
    # Render's Starter plan removes both the sleep and the disk limitation.
    plan: free
    region: frankfurt          # closest Render region to Nigeria
    # --include=dev is REQUIRED: NODE_ENV=production below makes npm skip
    # devDependencies, and vite + the build toolchain live there.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    # Cheap endpoint; keeps the service warm and lets Render see it is alive.
    healthCheckPath: /api/live/sync
    envVars:
      - key: NODE_ENV
        value: production
      # Gates the host console and the host-only API routes. Generate with:
      #   openssl rand -hex 16
      # Set the value in the Render dashboard, never in this file.
      - key: HOST_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
